<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Omega Stability - Iterated Logarithm Framework</title>
  <desc id="desc">A scientific banner with layered logarithmic curves and power-tower inspired geometry.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>

    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5bc0be"/>
      <stop offset="100%" stop-color="#c6f1e7"/>
    </linearGradient>

    <linearGradient id="accentB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbf69"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8ea9c433" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g opacity="0.16">
    <circle cx="940" cy="180" r="220" fill="#5bc0be"/>
    <circle cx="1030" cy="480" r="200" fill="#ff9f1c"/>
  </g>

  <g stroke-linecap="round" fill="none" filter="url(#softGlow)">
    <path d="M 70 530 C 210 460, 310 420, 430 360 C 500 325, 560 270, 620 190" stroke="url(#accentA)" stroke-width="5"/>
    <path d="M 80 560 C 250 530, 390 500, 560 430 C 650 394, 730 330, 830 220" stroke="#b6fff1" stroke-width="2.2" opacity="0.85"/>
    <path d="M 80 600 C 230 590, 360 565, 520 510 C 670 458, 830 370, 980 230" stroke="#89f0de" stroke-width="1.8" opacity="0.75"/>
  </g>

  <g opacity="0.95">
    <rect x="820" y="95" width="170" height="170" rx="12" fill="#ffffff10" stroke="#d8f3ff66"/>
    <rect x="860" y="130" width="170" height="170" rx="12" fill="#ffffff12" stroke="#d8f3ff7a"/>
    <rect x="900" y="165" width="170" height="170" rx="12" fill="#ffffff14" stroke="#d8f3ff8e"/>
    <text x="935" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#eefcff">c</text>
    <text x="975" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#eefcff">c</text>
    <text x="1015" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#eefcff">c^u</text>
  </g>

  <g>
    <text x="78" y="190" fill="#e6f4ff" font-size="62" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1.2">Omega Stability</text>
    <text x="78" y="245" fill="#b9d7ea" font-size="30" font-family="Georgia, 'Times New Roman', serif">Iterated Logarithm and Tower Residue Testbed</text>

    <rect x="78" y="278" width="372" height="44" rx="10" fill="#ff9f1c1f" stroke="#ffd28a66"/>
    <text x="98" y="307" fill="#ffe8c1" font-size="21" font-family="Consolas, 'Courier New', monospace">omega(c, z, eps) -> stable chain</text>

    <text x="78" y="364" fill="#d6f7ff" font-size="23" font-family="Consolas, 'Courier New', monospace">L2(x) = log(log(x))</text>
    <text x="78" y="402" fill="#d6f7ff" font-size="23" font-family="Consolas, 'Courier New', monospace">omega3(c, x) = log_c(x) - 3</text>
  </g>

  <g opacity="0.9">
    <circle cx="118" cy="514" r="7" fill="#ffbf69"/>
    <circle cx="202" cy="478" r="7" fill="#ffbf69"/>
    <circle cx="286" cy="451" r="7" fill="#ffbf69"/>
    <circle cx="370" cy="415" r="7" fill="#ffbf69"/>
    <circle cx="458" cy="366" r="7" fill="#ffbf69"/>
    <circle cx="545" cy="307" r="7" fill="#ffbf69"/>
  </g>
</svg>
